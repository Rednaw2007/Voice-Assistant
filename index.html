<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Voice Assistant</title>
  <!-- Load MQTT library directly from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
    button { padding: 15px 25px; font-size: 18px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; }
    .record-btn { background: #e63946; color: white; }
    select, input { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; width: 80%; max-width: 300px; }
    #status { margin-top: 20px; font-weight: bold; color: #a8dadc; word-wrap: break-word; padding: 0 10px; }
  </style>
</head>
<body>

  <h2>Voice Assistant Controller</h2>

  <label for="userSelect">Select User:</label><br>
  <select id="userSelect">
    <option value="Luther">Luther</option>
    <option value="Sarah">Sarah</option>
  </select><br><br>

  <input type="password" id="apiKey" placeholder="Enter Groq API Key"><br><br>

  <button id="recordBtn" class="record-btn">🎤 Start Talking</button>

  <p id="status">Status: Ready</p>

  <script>
    let mqttClient;
    let mediaRecorder;
    let audioChunks = [];

    document.addEventListener("DOMContentLoaded", () => {
      const recordBtn = document.getElementById("recordBtn");
      const statusText = document.getElementById("status");

      // 1. Initialize Secure MQTT Connection over SSL (Required for Vercel/HTTPS)
      try {
        mqttClient = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 1000, 10));

        mqttClient.connect({
          useSSL: true,
          onSuccess: () => {
            statusText.innerText = "Status: Connected to MQTT Broker";
          },
          onFailure: (err) => {
            console.error("MQTT Error:", err);
            statusText.innerText = "MQTT Connection Failed (Check Console)";
          }
        });
      } catch (err) {
        console.error("MQTT Setup Error:", err);
      }

      // 2. Microphone Recording Logic
      recordBtn.addEventListener("click", async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = processAudio;

            mediaRecorder.start();
            recordBtn.innerText = "🛑 Stop & Send";
            statusText.innerText = "Status: Listening...";
          } catch (err) {
            console.error("Microphone access error:", err);
            alert("Microphone access denied or not supported.");
          }
        } else {
          mediaRecorder.stop();
          recordBtn.innerText = "🎤 Start Talking";
          statusText.innerText = "Status: Processing...";
        }
      });
    });

    // 3. Audio Processing & Speech Recognition
    async function processAudio() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const userName = document.getElementById("userSelect").value;
      const statusText = document.getElementById("status");

      if (!apiKey) {
        alert("Please enter your Groq API Key!");
        statusText.innerText = "Status: Missing API Key";
        return;
      }

      // Extract clean MIME type without codecs parameters
      const rawType = mediaRecorder ? mediaRecorder.mimeType : "audio/webm";
      const mimeType = rawType.split(";")[0] || "audio/webm";
      const audioBlob = new Blob(audioChunks, { type: mimeType });

      const formData = new FormData();
      formData.append("file", audioBlob, "audio.webm");
      formData.append("model", "whisper-large-v3");

      try {
        // Step A: Speech-to-Text via Groq Whisper API
        const sttResponse = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: { 
            "Authorization": `Bearer ${apiKey}`
          },
          body: formData
        });

        const sttData = await sttResponse.json();

        if (!sttResponse.ok) {
          console.error("STT Error Details:", sttData);
          statusText.innerText = `STT Error (${sttResponse.status}): ${sttData.error?.message || "Failed to process audio"}`;
          return;
        }

        const userText = sttData.text;
        if (!userText || !userText.trim()) {
          statusText.innerText = "No speech detected. Try speaking again.";
          return;
        }

        statusText.innerText = `You said: "${userText}"`;

        // Step B: Generate AI Response via Llama 3.3
        const llmResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            max_tokens: 150,
            messages: [
              {
                role: "system",
                content: `You are a smart voice assistant named Siri speaking to ${userName}. Keep answers brief, helpful, and strictly 3 sentences at most.`
              },
              { role: "user", content: userText }
            ]
          })
        });

        const llmData = await llmResponse.json();

        if (!llmResponse.ok) {
          console.error("LLM Error Details:", llmData);
          statusText.innerText = `LLM Error (${llmResponse.status}): ${llmData.error?.message || "Failed to get reply"}`;
          return;
        }

        const aiReply = llmData.choices[0]?.message?.content || "No response generated.";
        statusText.innerText = `AI: ${aiReply}`;

        // Step C: Send Response to ESP32 via MQTT
        if (mqttClient && mqttClient.isConnected()) {
          const message = new Paho.MQTT.Message(aiReply);
          message.destinationName = "luther/voice_assistant/response";
          mqttClient.send(message);
        } else {
          console.warn("MQTT is not connected. Message displayed on screen only.");
        }

      } catch (err) {
        console.error("Process Audio Exception:", err);
        statusText.innerText = `Network or API Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
