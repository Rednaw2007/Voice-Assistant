<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Voice Assistant</title>
  <!-- Load MQTT library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
    button { padding: 15px 25px; font-size: 18px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; }
    .record-btn { background: #e63946; color: white; }
    select, input { padding: 10px; font-size: 16px; margin: 10px; border-radius: 5px; }
    #status { margin-top: 20px; font-weight: bold; color: #a8dadc; }
  </style>
</head>
<body>

  <h2>Voice Assistant Controller</h2>

  <label for="userSelect">Select User:</label>
  <select id="userSelect">
    <option value="Luther">Luther</option>
    <option value="Sarah">Sarah</option>
  </select><br>

  <input type="password" id="apiKey" placeholder="Enter Groq API Key"><br>

  <button id="recordBtn" class="record-btn">🎤 Start Talking</button>

  <p id="status">Status: Ready</p>

  <script>
    let mqttClient;
    let mediaRecorder;
    let audioChunks = [];

    document.addEventListener("DOMContentLoaded", () => {
      const recordBtn = document.getElementById("recordBtn");
      const statusText = document.getElementById("status");

      // 1. Initialize MQTT WebSockets Connection
      try {
        mqttClient = new Paho.MQTT.Client("broker.hivemq.com", 8000, "web_" + parseInt(Math.random() * 1000, 10));

        mqttClient.connect({
          onSuccess: () => {
            statusText.innerText = "Status: Connected to MQTT Broker";
          },
          onFailure: (err) => {
            console.error("MQTT Error:", err);
            statusText.innerText = "MQTT Connection Failed (Check Console)";
          }
        });
      } catch (err) {
        console.error("MQTT Setup Error:", err);
      }

      // 2. Attach Click Listener to Button
      recordBtn.addEventListener("click", async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = processAudio;

            mediaRecorder.start();
            recordBtn.innerText = "🛑 Stop & Send";
            statusText.innerText = "Status: Listening...";
          } catch (err) {
            console.error("Microphone access error:", err);
            alert("Microphone access denied or not supported.");
          }
        } else {
          mediaRecorder.stop();
          recordBtn.innerText = "🎤 Start Talking";
          statusText.innerText = "Status: Processing...";
        }
      });
    });

    // 3. Audio Processing & Sending Logic
    async function processAudio() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const userName = document.getElementById("userSelect").value;
      const statusText = document.getElementById("status");

      if (!apiKey) {
        alert("Please enter your Groq API Key!");
        statusText.innerText = "Status: Missing API Key";
        return;
      }

      const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const formData = new FormData();
      formData.append("file", audioBlob, "audio.wav");
      formData.append("model", "whisper-large-v3");

      try {
        // Step A: Speech-to-Text via Groq Whisper API
        const sttResponse = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${apiKey}` },
          body: formData
        });

        const sttData = await sttResponse.json();
        const userText = sttData.text;
        statusText.innerText = `You said: "${userText}"`;

        // Step B: Generate Answer with 3-Sentence Rule
        const llmResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            max_tokens: 150,
            messages: [
              {
                role: "system",
                content: `You are a smart voice assistant named Siri speaking to ${userName}. IMPORTANT: Keep answers brief, helpful, and strictly 3 sentences at most.`
              },
              { role: "user", content: userText }
            ]
          })
        });

        const llmData = await llmResponse.json();
        const aiReply = llmData.choices[0].message.content;

        statusText.innerText = `AI: ${aiReply}`;

        // Step C: Send to ESP32 via MQTT
        if (mqttClient && mqttClient.isConnected()) {
          const message = new Paho.MQTT.Message(aiReply);
          message.destinationName = "luther/voice_assistant/response";
          mqttClient.send(message);
        } else {
          console.warn("MQTT is not connected. Response displayed on screen only.");
        }

      } catch (err) {
        console.error(err);
        statusText.innerText = "Error processing request.";
      }
    }
  </script>
</body>
</html>
